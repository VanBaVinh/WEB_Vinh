<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — VinhBaPhone Admin Portal</title>
  <meta name="description" content="Đăng nhập quản trị VinhBaPhone - Hệ thống bán lẻ điện thoại, laptop, gaming gear hàng đầu." />

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Inter"', 'system-ui', '-apple-system', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              200: '#c7d2fe',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
              800: '#3730a3',
              900: '#312e81',
            }
          },
          boxShadow: {
            'card': '0 10px 25px -5px rgba(15, 23, 42, 0.05), 0 8px 10px -6px rgba(15, 23, 42, 0.03)',
            'card-hover': '0 20px 25px -5px rgba(15, 23, 42, 0.08), 0 8px 10px -6px rgba(15, 23, 42, 0.04)',
          }
        }
      }
    }
  </script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    #toast-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .toast {
      min-width: 300px;
      max-width: 420px;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 0.875rem;
      font-weight: 500;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
      display: flex;
      align-items: center;
      gap: 10px;
      transition: all 0.3s ease;
      animation: toast-in 0.3s ease forwards;
    }
    .toast-success {
      background-color: #ecfdf5;
      border: 1px solid #a7f3d0;
      color: #065f46;
    }
    .toast-error {
      background-color: #fef2f2;
      border: 1px solid #fecaca;
      color: #991b1b;
    }
    .toast-info {
      background-color: #eff6ff;
      border: 1px solid #bfdbfe;
      color: #1e40af;
    }
    @keyframes toast-in {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="h-full flex flex-col justify-center py-12 sm:px-6 lg:px-8 bg-gradient-to-br from-slate-50 via-gray-100 to-slate-200 antialiased text-slate-800">

  <!-- Background Ambient Glow (Subtle & Minimalist) -->
  <div class="fixed inset-0 pointer-events-none overflow-hidden flex items-center justify-center -z-10">
    <div class="w-[600px] h-[600px] bg-blue-600/5 rounded-full blur-3xl transform -translate-y-12"></div>
  </div>

  <div class="sm:mx-auto sm:w-full sm:max-w-md">

    <!-- Card Container (Border-radius: 14px with diffused drop shadow) -->
    <div class="bg-white py-10 px-6 sm:px-10 rounded-[14px] border border-slate-200/90 shadow-card hover:shadow-card-hover transition-shadow duration-300">

      <!-- Header Section -->
      <div class="text-center mb-8">
        <!-- Brand Logo -->
        <a href="index.html" class="inline-flex items-center gap-2 mb-3 group" title="Về trang chủ">
          <div class="inline-flex items-center justify-center w-11 h-11 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-600 text-white shadow-lg shadow-blue-500/25 transition-transform duration-200 group-hover:scale-105">
            <span class="text-xl font-black">⚡</span>
          </div>
          <div class="text-left leading-none">
            <span class="text-2xl font-black tracking-tight text-slate-900 block">
              VinhBa<span class="text-blue-600">Phone</span>
            </span>
            <span class="text-[9px] font-bold tracking-widest text-slate-400 uppercase mt-0.5 block">ADMIN PORTAL</span>
          </div>
        </a>
        <h1 class="text-xl font-extrabold tracking-tight text-slate-900 mt-2">
          Đăng Nhập Quản Trị
        </h1>
        <p class="mt-1 text-xs text-slate-500">
          Hệ thống điều hành bán lẻ & quản trị dữ liệu tập trung
        </p>
      </div>

      <!-- Error Alert Message -->
      <div id="error-alert" class="hidden mb-6 p-3 rounded-lg bg-red-50 border border-red-200 text-red-700 text-xs flex items-center gap-2.5">
        <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <span id="error-text">Thông tin đăng nhập không hợp lệ. Vui lòng thử lại!</span>
      </div>

      <!-- Login Form -->
      <form id="login-form" class="space-y-4" novalidate>

        <!-- Username / Email Field -->
        <div>
          <label for="username" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
            Tài khoản quản trị / Email
          </label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
              </svg>
            </div>
            <input
              id="username"
              name="username"
              type="text"
              autocomplete="username"
              required
              placeholder="Nhập username (admin) hoặc email"
              class="block w-full pl-11 pr-3.5 py-2.5 bg-slate-50/50 border border-slate-300 rounded-lg text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 focus:bg-white transition-colors"
            />
          </div>
        </div>

        <!-- Password Field with Show/Hide Toggle -->
        <div>
          <label for="password" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
            Mật khẩu bảo mật
          </label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
              </svg>
            </div>
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              required
              placeholder="Nhập mật khẩu (Admin@2024)"
              class="block w-full pl-11 pr-11 py-2.5 bg-slate-50/50 border border-slate-300 rounded-lg text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 focus:bg-white transition-colors"
            />
            <!-- Toggle Eye Button -->
            <button
              type="button"
              id="toggle-password"
              aria-label="Hiện/ẩn mật khẩu"
              class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600 focus:outline-none transition-colors cursor-pointer"
            >
              <!-- Eye Icon (Hidden) -->
              <svg id="eye-icon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
              </svg>
              <!-- Eye Off Icon (Shown) -->
              <svg id="eye-off-icon" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
              </svg>
            </button>
          </div>
        </div>

        <!-- Action Elements: Remember me & Forgot password -->
        <div class="flex items-center justify-between text-xs">
          <div class="flex items-center">
            <input
              id="remember-me"
              name="remember-me"
              type="checkbox"
              class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-slate-300 rounded cursor-pointer"
            />
            <label for="remember-me" class="ml-2 block text-slate-600 cursor-pointer select-none">
              Ghi nhớ đăng nhập
            </label>
          </div>

          <div>
            <a href="#" id="forgot-password-link" class="font-semibold text-blue-600 hover:text-blue-500 hover:underline transition-colors">
              Quên mật khẩu?
            </a>
          </div>
        </div>

        <!-- Primary Action Button: Sign In -->
        <div>
          <button
            type="submit"
            id="submit-btn"
            class="w-full flex justify-center py-2.5 px-4 border border-transparent rounded-lg shadow-sm text-sm font-bold text-white bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-all cursor-pointer"
          >
            Đăng Nhập Vào Bảng Điều Khiển
          </button>
        </div>
      </form>

      <!-- Quick Demo Credentials Pill -->
      <div class="mt-6 pt-5 border-t border-slate-100 flex items-center justify-between text-xs text-slate-500 bg-slate-50/80 p-3 rounded-lg border">
        <div>
          <span class="block text-[10px] text-slate-400 font-bold uppercase">Tài khoản quản trị mặc định:</span>
          <span class="font-mono text-blue-600 font-bold">admin</span> / <span class="font-mono text-slate-700 font-semibold">Admin@2024</span>
        </div>
        <button
          type="button"
          id="quick-fill-btn"
          class="px-3 py-1.5 rounded-md bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs transition-colors cursor-pointer shadow-sm"
        >
          ⚡ Điền nhanh
        </button>
      </div>

      <!-- Security Trust Bar in Card -->
      <div class="mt-5 text-center text-[10.5px] text-slate-400 flex items-center justify-center gap-2">
        <span>🔒 Mã hóa SHA-256</span>
        <span>•</span>
        <span>🛡️ Chuẩn RBAC</span>
        <span>•</span>
        <span>JWT Session</span>
      </div>

    </div>

    <!-- Back to Store Link -->
    <div class="mt-6 text-center">
      <a href="index.html" class="text-xs font-semibold text-slate-600 hover:text-blue-600 transition-colors inline-flex items-center gap-1.5 bg-white px-4 py-2 rounded-full border border-slate-200 shadow-sm">
        <svg class="w-4 h-4 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
        </svg>
        <span>← Quay về Cửa Hàng VinhBaPhone</span>
      </a>
    </div>

  </div>

  <!-- Toast Container -->
  <div id="toast-container"></div>

  <script src="js/data.js"></script>
  <script>
    /**
     * VinhBaPhone — Standalone Login System (No Server Required)
     * Dữ liệu tài khoản được lưu trong localStorage.
     * Mở trực tiếp file này trong trình duyệt để sử dụng.
     */

    // ── Hệ thống tài khoản mặc định ──
    const DEFAULT_ACCOUNTS = [
      {
        id: 1,
        username: "admin",
        email: "admin@vinhbaphone.vn",
        password: "Admin@2024",
        full_name: "Quản Trị Viên Tối Cao",
        role: "admin",
        is_active: true,
        avatar_url: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=200&q=80",
        created_at: "2024-01-01T00:00:00"
      }
    ];

    // ── Khởi tạo dữ liệu mặc định nếu chưa có ──
    function initDefaultData() {
      if (!localStorage.getItem("vinhba_users_db")) {
        localStorage.setItem("vinhba_users_db", JSON.stringify(DEFAULT_ACCOUNTS));
      }
      // Seed sản phẩm mẫu nếu chưa có
      if (!localStorage.getItem("vinhba_products_db")) {
        const sampleProducts = (window.products && Array.isArray(window.products) && window.products.length > 0)
          ? window.products.map(p => ({
              id: p.id,
              name: p.name,
              category: p.category || "phone",
              brand: p.brand || "VinhBaPhone",
              price: p.price || 0,
              original_price: p.originalPrice || p.price || 0,
              stock: typeof p.stock === "number" ? p.stock : 15,
              image_url: p.img || p.image_url || "",
              badge: p.tag || p.badge || "CHÍNH HÃNG",
              is_flash_sale: Boolean(p.isFlashSale || p.is_flash_sale),
              is_active: true,
              description: Array.isArray(p.specs) ? p.specs.join(" • ") : (p.description || ""),
              created_at: new Date().toISOString()
            }))
          : [];
        if (sampleProducts.length > 0) {
          localStorage.setItem("vinhba_products_db", JSON.stringify(sampleProducts));
        }
      }
    }

    // ── Toast Notification ──
    function showToast(message, type = "info") {
      let container = document.getElementById("toast-container");
      const toast = document.createElement("div");
      toast.className = `toast toast-${type}`;
      toast.textContent = message;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = "0";
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    }

    // ── Xác thực tài khoản (client-side fallback) ──
    function authenticateUser(username, password) {
      const usersDB = JSON.parse(localStorage.getItem("vinhba_users_db") || "[]");
      return usersDB.find(u =>
        (u.username === username || u.email === username) &&
        u.password === password &&
        u.is_active
      );
    }

    // ── Tính đường dẫn tương đối đến dashboard ──
    function getDashboardPath() {
      if (window.location.protocol.startsWith('http')) {
        return '/admin';
      }
      const currentPath = window.location.pathname;
      const currentDir = currentPath.substring(0, currentPath.lastIndexOf('/') + 1);
      return currentDir + 'admin/dashboard.html';
    }

    // ── Init ──
    document.addEventListener("DOMContentLoaded", () => {
      initDefaultData();

      // Kiểm tra nếu đã đăng nhập → chuyển thẳng dashboard
      const token = localStorage.getItem("vinhba_admin_token");
      const session = localStorage.getItem("vinhba_admin_session");
      if (token || session) {
        try {
          const s = session ? JSON.parse(session) : null;
          if (token || (s && s.username && s.logged_in)) {
            window.location.href = getDashboardPath();
            return;
          }
        } catch {}
      }

      const loginForm = document.getElementById("login-form");
      const usernameInput = document.getElementById("username");
      const passwordInput = document.getElementById("password");
      const submitBtn = document.getElementById("submit-btn");
      const errorAlert = document.getElementById("error-alert");
      const errorText = document.getElementById("error-text");

      // Load saved username
      const savedUsername = localStorage.getItem("vinhba_remember_username");
      if (savedUsername) {
        usernameInput.value = savedUsername;
        document.getElementById("remember-me").checked = true;
      }

      // Toggle Password
      const togglePasswordBtn = document.getElementById("toggle-password");
      const eyeIcon = document.getElementById("eye-icon");
      const eyeOffIcon = document.getElementById("eye-off-icon");

      if (togglePasswordBtn) {
        togglePasswordBtn.addEventListener("click", () => {
          const isPassword = passwordInput.type === "password";
          passwordInput.type = isPassword ? "text" : "password";
          eyeIcon.classList.toggle("hidden", isPassword);
          eyeOffIcon.classList.toggle("hidden", !isPassword);
        });
      }

      // Auto-fill button
      document.getElementById("quick-fill-btn").addEventListener("click", () => {
        usernameInput.value = "admin";
        passwordInput.value = "Admin@2024";
        showToast("Đã điền tài khoản Quản trị (admin / Admin@2024)", "info");
      });

      // Social Logins
      document.querySelectorAll(".social-login-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          showToast(`${btn.getAttribute("data-provider")} authentication ready`, "info");
        });
      });

      // Forgot password & Signup
      document.getElementById("forgot-password-link").addEventListener("click", (e) => {
        e.preventDefault();
        showToast("Hướng dẫn đặt lại mật khẩu đã được gửi", "info");
      });
      document.getElementById("signup-link").addEventListener("click", (e) => {
        e.preventDefault();
        showToast("Vui lòng liên hệ Quản trị viên để cấp tài khoản", "info");
      });

      // ── Submit handler — Ưu tiên xác thực qua FastAPI Backend (/api/auth/login), fallback Local ──
      loginForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        errorAlert.classList.add("hidden");

        const username = usernameInput.value.trim();
        const password = passwordInput.value;

        if (!username || !password) {
          errorText.textContent = "Vui lòng nhập đầy đủ tên đăng nhập và mật khẩu.";
          errorAlert.classList.remove("hidden");
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = "Đang xác thực...";

        // 1. Thử xác thực qua FastAPI Backend nếu đang chạy HTTP/HTTPS
        if (window.location.protocol.startsWith("http")) {
          try {
            const resp = await fetch("/api/auth/login", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ username, password }),
            });
            if (resp.ok) {
              const data = await resp.json();
              if (data && data.access_token) {
                localStorage.setItem("vinhba_admin_token", data.access_token);
                if (data.user) {
                  localStorage.setItem("vinhba_admin_user", JSON.stringify(data.user));
                  localStorage.setItem("vinhba_admin_session", JSON.stringify({
                    ...data.user,
                    logged_in: true,
                    login_time: new Date().toISOString()
                  }));
                }
                const rememberCheckbox = document.getElementById("remember-me");
                if (rememberCheckbox && rememberCheckbox.checked) {
                  localStorage.setItem("vinhba_remember_username", username);
                } else {
                  localStorage.removeItem("vinhba_remember_username");
                }
                showToast("Đăng nhập Hệ thống Quản trị thành công!", "success");
                setTimeout(() => {
                  window.location.href = getDashboardPath();
                }, 450);
                return;
              }
            } else if (resp.status === 401 || resp.status === 403) {
              const errData = await resp.json().catch(() => ({}));
              errorText.textContent = errData.detail || "Tên đăng nhập hoặc mật khẩu không đúng.";
              errorAlert.classList.remove("hidden");
              submitBtn.disabled = false;
              submitBtn.textContent = "Sign In";
              return;
            }
          } catch (apiErr) {
            // Backend offline -> fallback xuống client-side
          }
        }

        // 2. Fallback xác thực Client-side (khi mở file:// trực tiếp)
        setTimeout(() => {
          const user = authenticateUser(username, password);

          if (user) {
            const sessionData = {
              id: user.id,
              username: user.username,
              email: user.email,
              full_name: user.full_name,
              role: user.role,
              avatar_url: user.avatar_url,
              logged_in: true,
              login_time: new Date().toISOString()
            };
            localStorage.setItem("vinhba_admin_session", JSON.stringify(sessionData));
            localStorage.setItem("vinhba_admin_user", JSON.stringify(sessionData));

            const rememberCheckbox = document.getElementById("remember-me");
            if (rememberCheckbox && rememberCheckbox.checked) {
              localStorage.setItem("vinhba_remember_username", username);
            } else {
              localStorage.removeItem("vinhba_remember_username");
            }

            showToast("Đăng nhập thành công! Đang chuyển hướng...", "success");

            setTimeout(() => {
              window.location.href = getDashboardPath();
            }, 500);
          } else {
            errorText.textContent = "Tên đăng nhập hoặc mật khẩu không đúng. Hoặc tài khoản đã bị khóa.";
            errorAlert.classList.remove("hidden");
            submitBtn.disabled = false;
            submitBtn.textContent = "Sign In";
          }
        }, 300);
      });
    });
  </script>
</body>
</html>
